services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: dashboard_demo
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: ${DEMO_DB_PASSWORD:-dashboard-demo-password}
      MYSQL_ROOT_PASSWORD: ${DEMO_DB_ROOT_PASSWORD:-dashboard-root-password}
    volumes:
      - dashboard_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./server
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NODE_ENV: development
      FRONTEND_ORIGIN: http://localhost:8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dashboard_demo
      DB_USER: dashboard
      DB_PASSWORD: ${DEMO_DB_PASSWORD:-dashboard-demo-password}
      FILE_STORAGE_ROOT: /app/storage
      FILE_MAX_SIZE_BYTES: 52428800
      FILE_USER_QUOTA_BYTES: 1073741824
    volumes:
      - dashboard_files:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30

  seed:
    build:
      context: ./server
    command: ["node", "scripts/seed-demo-user.mjs"]
    environment:
      API_BASE_URL: http://api:3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: dashboard_demo
      DB_USER: dashboard
      DB_PASSWORD: ${DEMO_DB_PASSWORD:-dashboard-demo-password}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@example.com}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin@123456}
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: .
    ports:
      - "${DEMO_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

volumes:
  dashboard_mysql:
  dashboard_files:
